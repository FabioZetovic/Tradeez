spring:
  application:
    name: tradeez-backend

  # Reads backend/.env (KEY=VALUE lines) as properties when it exists. The file is gitignored, so
  # secrets such as DATABENTO_API_KEY live on the machine and never in the repository (DEC-032).
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/tradeez}
    username: ${DATABASE_USER:tradeez}
    password: ${DATABASE_PASSWORD:tradeez}

  jpa:
    open-in-view: false
    hibernate:
      # DEC-030: schema changes go through Flyway only. Hibernate must never touch the schema.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  error:
    # BUG-078: errors now reach /error (the chain lets the forward through), and an unhandled exception's message
    # can name SQL and values. Every message meant for the client is written by a handler; /error says only the
    # status.
    include-message: never
    include-stacktrace: never

# INVARIANT 4: all timestamps are UTC. Converted to exchange time only at the presentation edge.
# The JVM zone is set to UTC in TradeezApplication.useUtc() — a property here never did it (BUG-036).
tradeez:

  jwt:
    # DEC-032. Base64, 256-bit minimum. Generate with: openssl rand -base64 32
    # The default below is a well-known development value. JwtSecretGuard refuses to start the
    # application with it whenever cookies.secure is true, i.e. anywhere actually deployed.
    secret: ${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWRvLW5vdC11c2UtaW4tcHJvZC0wMDAwMDAwMA==}
    # Short, so a leaked token is good for minutes. "Sign out everywhere" and a password change end the
    # tokens already handed out at once (BUG-077: each carries the account's token generation).
    access-token-ttl: 15m
    refresh-token-ttl: 30d

  rate-limit:
    # BUG-002. In-memory and therefore per-instance: a speed bump, not a guarantee. A shared store
    # is the upgrade path if this is ever scaled beyond one replica.
    auth-attempts-per-window: ${AUTH_ATTEMPTS_PER_WINDOW:20}
    # BUG-070. How many proxies in front of the app append to X-Forwarded-For. 0: the header is ignored,
    # since a client can write anything in it. Behind one proxy that appends the caller's address, 1.
    trusted-proxies: ${TRUSTED_PROXIES:0}
    # BUG-080. Candles, setups, the clock and lessons asked for per account per minute (ReadRateLimit). The chart
    # asks for at most five when its window moves.
    reads-per-minute: ${READS_PER_MINUTE:240}

  evidence:
    # T21 (DEC-065). Recount every rule over the imported history after start-up when the data, a rule's
    # version or the counting changed — in the background. Tests switch it off.
    refresh-on-start: ${EVIDENCE_REFRESH_ON_START:true}

  practice:
    # T41 (DEC-080). What every practice trade costs, as a fill model's version: the standard — a tick of slippage on
    # every market and stop fill, a target filled once traded through, $4.50 a round trip. Not the learner's to set.
    costs: mkt-1t/slip-1t/thru-1t/comm-450c

  news:
    # T40 (DEC-079). Bring the economic calendar up to date after start-up and every six hours, from FRED and the
    # Fed's FOMC list. Tests switch it off: they never call FRED.
    refresh-enabled: ${NEWS_REFRESH_ENABLED:true}

  password:
    breach-check:
      # DEC-064. Have I Been Pwned's k-anonymous range API: only five hex characters of the password's SHA-1
      # leave the server. Fails open when the service does not answer in time.
      enabled: ${PASSWORD_BREACH_CHECK:true}
      url: https://api.pwnedpasswords.com/range/

  cookies:
    # false locally: a Secure cookie is silently dropped over plain HTTP, so local development
    # would look broken for a non-obvious reason. MUST be true anywhere deployed.
    secure: ${COOKIES_SECURE:false}
  cors:
    # DEC-032: strict CORS, explicit origins, credentials enabled. Never a wildcard.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# DEC-040 — real NQ from Databento. Every download is priced first and refused above these caps, so
# the free credit cannot be overrun by a mistake. Raising a cap is a decision for Fabio, not for code.
databento:
  api-key: ${DATABENTO_API_KEY:}
  base-url: ${DATABENTO_BASE_URL:https://hist.databento.com}
  dataset: GLBX.MDP3
  max-cost-per-request-usd: 5.00
  max-total-cost-usd: 100.00

# DEC-042 — Massive's free plan: CME minute bars, ~2 years back, five requests a minute.
fred:
  # DEC-079. Only ever in the request to FRED, whose API takes it as a query parameter; never logged.
  api-key: ${FRED_API_KEY:}
  base-url: ${FRED_BASE_URL:https://api.stlouisfed.org}

massive:
  api-key: ${MASSIVE_API_KEY:}
  base-url: ${MASSIVE_BASE_URL:https://api.massive.com}
  requests-per-minute: 5
  page-limit: 50000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # BUG-081: "when-authorized" with no roles named meant any signed-in learner, who was shown the database,
      # the disk and the server's folder path.
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha

logging:
  level:
    org.springframework.security: INFO
