# BUG-121 (T57). The deployed profile: the Docker image always runs with it (Dockerfile). Every secret below has NO
# default, so an instance missing one refuses to start instead of running on the development values written in
# application.yml. Local development never uses this profile.

spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}

server:
  # BUG-125. Behind the host's HTTPS proxy: believe its X-Forwarded-Proto and Host, so the app knows the request was
  # HTTPS (HSTS, Secure cookies, same-origin checks).
  # BUG-137. "native", not "framework": Spring's own filter believed X-Forwarded-For and Forwarded from anyone, and
  # rewrote the caller's address before the sign-in limits read it, so a new made-up address bought a new quota. Tomcat
  # believes the headers only from a proxy on a private network (server.tomcat.remoteip.internal-proxies, the host's
  # own), reads X-Forwarded-For from the right — what the proxy appended, not what the caller wrote — and ignores
  # Forwarded. The caller's address is then already the connection's, so ClientAddress reads no header (below).
  forward-headers-strategy: native

tradeez:
  jwt:
    secret: ${JWT_SECRET}
  rate-limit:
    # BUG-137: Tomcat has already taken the proxy's entry out of X-Forwarded-For; what is left was written by the
    # caller. Not configurable here.
    trusted-proxies: 0
  # T56. The address the app is reached at (https://…), for the links in its emails, and how mail is sent: no default,
  # and MailGuard refuses the local outbox here — an email nobody can read would leave every sign-up stuck.
  app-url: ${APP_URL}
  mail:
    provider: ${MAIL_PROVIDER}
    outbox-dir: ""
  cookies:
    # Deployed means HTTPS: never configurable off here.
    secure: true
  cors:
    # The page and the API are one site (DEC-084): no other origin is needed. Set only if another site must call it.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

# BUG-132. The API's description is for building against it locally; security refuses it deployed, and here it is
# not built at all.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
